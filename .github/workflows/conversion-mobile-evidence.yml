name: Conversion mobile evidence
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  live-mobile:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'conversion/r1-20261118-bitevo' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Measure mobile production routes
        run: node scripts/measure-conversion-mobile.mjs
