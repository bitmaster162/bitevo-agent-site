name: Public Uptime Monitor

on:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SEND_TEST_ALERT to send one test Telegram alert after healthy GET checks'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: bitevo-public-uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve 30-minute monitor slot
        id: slot
        if: github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/public-monitor-slot-gate.mjs

      - name: GET public endpoints and alert on failure or explicit test
        if: github.event_name != 'schedule' || steps.slot.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLIC_MONITOR_TEST_CONFIRM: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm || '' }}
        run: node scripts/monitor-public-endpoints.mjs

      - name: Write completed slot marker
        if: always() && github.event_name == 'schedule' && steps.slot.outputs.should_run == 'true'
        shell: bash
        run: |
          mkdir -p .public-monitor-slot
          printf '%s\n' "${{ steps.slot.outputs.slot_key }}" > .public-monitor-slot/slot.txt

      - name: Persist completed slot marker
        if: always() && github.event_name == 'schedule' && steps.slot.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.slot.outputs.slot_key }}
          path: .public-monitor-slot/slot.txt
          retention-days: 1
          if-no-files-found: error
