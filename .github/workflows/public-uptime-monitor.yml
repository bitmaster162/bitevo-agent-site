name: Public Uptime Monitor

on:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: bitevo-public-uptime-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: GET public endpoints and alert on failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/monitor-public-endpoints.mjs
