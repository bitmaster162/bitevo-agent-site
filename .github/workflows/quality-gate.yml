name: BitEvo Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
      - name: Install exact dependencies
        run: npm ci
      - name: Inventory dependency advisories (non-blocking)
        continue-on-error: true
        run: npm audit --json
      - name: Preview in-range audit fix with npm solver (non-blocking)
        continue-on-error: true
        run: |
          npm audit fix --package-lock-only --ignore-scripts || true
          echo '=== POST-FIX AUDIT ==='
          npm audit --json || true
          echo '=== SOLVER TARGET VERSIONS ==='
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          for (const name of ['astro', 'esbuild', 'js-yaml', 'nanoid', 'postcss', 'sharp', 'svgo']) {
            console.log(`${name}=${lock.packages?.[`node_modules/${name}`]?.version ?? 'absent'}`);
          }
          NODE
          echo '=== SOLVER DIFF STAT ==='
          git diff --stat -- package.json package-lock.json
          echo '=== SOLVER WORKTREE ==='
          git status --short -- package.json package-lock.json
          git checkout -- package.json package-lock.json
      - name: Build and run provider-neutral repository gates
        run: npm run build:core
