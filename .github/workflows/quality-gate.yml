name: BitEvo Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
      - name: Install exact dependencies
        run: npm ci
      - name: Inventory dependency advisories (non-blocking)
        continue-on-error: true
        run: npm audit --json
      - name: Build and run provider-neutral repository gates
        run: npm run build:core
      - name: Verify Vercel hosting contract
        run: npm run verify:provider:vercel
      - name: Verify Cloudflare hosting contract
        run: npm run verify:provider:cloudflare

  main-history-audit:
    name: main-history-audit
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
      - name: Verify merged-PR lineage for current main history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const { GITHUB_TOKEN, REPOSITORY, EVENT_NAME, TARGET_SHA } = process.env;
          if (!GITHUB_TOKEN || !REPOSITORY || !EVENT_NAME || !TARGET_SHA) {
            throw new Error('missing GitHub workflow context');
          }

          const endpoint = `https://api.github.com/repos/${REPOSITORY}/commits/${TARGET_SHA}/pulls`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'bitevo-main-history-audit',
          };

          for (let attempt = 1; attempt <= 3; attempt += 1) {
            const response = await fetch(endpoint, { headers });
            if (!response.ok) {
              throw new Error(`GitHub associated-pulls lookup failed: HTTP ${response.status}`);
            }
            const pulls = await response.json();
            const mergedToMain = pulls.filter(pr => pr?.merged_at && pr?.base?.ref === 'main');
            if (mergedToMain.length > 0) {
              console.log(`MAIN_HISTORY_AUDIT=PASS event=${EVENT_NAME} sha=${TARGET_SHA} merged_prs=${mergedToMain.map(pr => pr.number).join(',')}`);
              process.exit(0);
            }
            if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 5000));
          }

          console.error(`MAIN_HISTORY_AUDIT=FAIL event=${EVENT_NAME} sha=${TARGET_SHA} reason=no_associated_merged_pr`);
          console.error('This is a detective control only: without server-side branch protection it cannot prevent a direct push before the push event exists.');
          process.exit(1);
          NODE
