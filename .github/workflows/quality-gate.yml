name: BitEvo Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
      - name: Install exact dependencies
        run: npm ci
      - name: Generate one-shot solver lock artifact
        run: |
          cp package-lock.json package-lock.original.json
          npm audit fix --package-lock-only --ignore-scripts || true
          cp package-lock.json package-lock.solver.json
          mv package-lock.original.json package-lock.json
      - name: Upload solver lock artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-lock-solver
          path: package-lock.solver.json
          if-no-files-found: error
          retention-days: 1
      - name: Inventory dependency advisories (non-blocking)
        continue-on-error: true
        run: npm audit --json
      - name: Build and run provider-neutral repository gates
        run: npm run build:core
