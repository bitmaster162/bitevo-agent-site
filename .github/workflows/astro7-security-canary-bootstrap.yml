name: Astro 7 Esbuild CSP Compatibility Probe

on:
  push:
    branches:
      - agent/astro7-security-canary-20260903

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout canary branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: agent/astro7-security-canary-20260903
      - name: Setup target Node floor
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.1.0
        with:
          node-version: '22.19.0'
      - name: Install exact production baseline
        run: |
          npm ci
          test "$(node -p "require('./node_modules/astro/package.json').version")" = "6.4.8"
      - name: Apply minimal Astro 7 migration plus explicit esbuild compatibility minifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('src/pages/universe.astro', 'src/pages/ru/universe.astro'):
              path = Path(name)
              source = path.read_text()
              if '<style>' not in source or '</style>' in source:
                  raise SystemExit(f'{name}: unexpected style-closure baseline')
              path.write_text(source.rstrip() + '\n</style>\n')
          Path('astro.config.mjs').write_text("// @ts-check\nimport { defineConfig } from 'astro/config';\n\n// Preserve reviewed CSP byte contract while migrating Vite 8 away from its new Oxc/Lightning CSS minifier defaults.\nexport default defineConfig({\n  vite: {\n    build: {\n      minify: 'esbuild',\n      cssMinify: 'esbuild'\n    }\n  }\n});\n")
          PY
          npm pkg set engines.node=">=22.19.0"
          npm install astro@7.2.10 --save-exact
          npm install --save-dev --save-exact esbuild@0.28.1
          test "$(node -p "require('./node_modules/astro/package.json').version")" = "7.2.10"
          test "$(node -p "require('./node_modules/esbuild/package.json').version")" = "0.28.1"
      - name: Capture audit
        run: |
          npm audit --json > /tmp/audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const v=audit.metadata?.vulnerabilities || {};
          console.log(`ASTRO7_ESBUILD_COMPAT_AUDIT total=${v.total ?? 'unknown'} critical=${v.critical ?? 'unknown'} high=${v.high ?? 'unknown'} moderate=${v.moderate ?? 'unknown'} low=${v.low ?? 'unknown'}`);
          for (const [name,info] of Object.entries(audit.vulnerabilities || {})) console.log(`ASTRO7_AUDIT_ITEM package=${name} severity=${info.severity} range=${info.range}`);
          if ((v.critical || 0) !== 0 || (v.high || 0) !== 0 || (v.moderate || 0) !== 0) throw new Error('moderate/high/critical findings remain');
          NODE
      - name: Build Astro 7 with explicit legacy minifier contract
        run: npm run build:site
      - name: Require old reviewed CSP hashes to remain exact
        run: node scripts/verify-inline-csp.mjs
      - name: Run full provider-neutral contract
        run: npm run build:core
      - name: Show exact canary delta only
        run: |
          git diff --check
          git status --short
          git diff --stat
          git diff -- astro.config.mjs package.json src/pages/universe.astro src/pages/ru/universe.astro | sed -n '1,280p'
