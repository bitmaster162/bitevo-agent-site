name: Astro 7 Security Canary Bootstrap

on:
  push:
    branches:
      - agent/astro7-security-canary-20260903

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout canary branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: agent/astro7-security-canary-20260903
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.1.0
        with:
          node-version: '22.19.0'
      - name: Rewrite Universe compile-time lists for Rust compiler
        run: |
          python3 - <<'PY'
          from pathlib import Path

          route_cards = [
              '        <div class="map-route"><span>BUILD</span><strong>BitEvo</strong></div>',
              '        <div class="map-route"><span>LEARN</span><strong>AI Skill Lab</strong></div>',
              '        <div class="map-route"><span>VISION</span><strong>VisionAssist</strong></div>',
              '        <div class="map-route"><span>CRYPTO</span><strong>Crypto Guides</strong></div>',
              '        <div class="map-route"><span>ARENA</span><strong>Sovereign Arena</strong></div>',
              '        <div class="map-route"><span>LABS</span><strong>BitEvo Labs</strong></div>',
          ]

          en_cards = [
              '      <a class="module-card panel" href="/build">',
              '        <div class="module-top"><span>01</span><span class="status">LIVE</span></div>',
              '        <div><small>BUILD</small><h3>BitEvo</h3><p>Build, audit and harden AI workflows with authority, evidence and recovery kept explicit.</p></div>',
              '        <div class="module-foot">Open surface ↗</div>',
              '      </a>',
              '      <article class="module-card panel module-card-muted">',
              '        <div class="module-top"><span>02</span><span class="status">RELEASE PREP</span></div>',
              '        <div><small>LEARN</small><h3>AI Skill Lab</h3><p>Practical AI learning for personal, family and business use, built around visible work rather than black-box promises.</p></div>',
              '        <div class="module-foot">Public route not published yet</div>',
              '      </article>',
              '      <a class="module-card panel" href="/vision">',
              '        <div class="module-top"><span>03</span><span class="status">PUBLIC DEMO</span></div>',
              '        <div><small>VISION</small><h3>VisionAssist</h3><p>Evidence-grounded visual reasoning with explicit observations, competing hypotheses, counterevidence and uncertainty. Public demo only; private runtime stays private.</p></div>',
              '        <div class="module-foot">Open surface ↗</div>',
              '      </a>',
              '      <a class="module-card panel" href="https://cryptoguidessite.vercel.app/" target="_blank" rel="noopener">',
              '        <div class="module-top"><span>04</span><span class="status">LIVE · REVIEW</span></div>',
              '        <div><small>CRYPTO</small><h3>Crypto Guides</h3><p>A public crypto knowledge portal. The site is live while taxonomy, currentness and evidence boundaries continue to be reviewed.</p></div>',
              '        <div class="module-foot">Open surface ↗</div>',
              '      </a>',
              '      <a class="module-card panel" href="https://sovereign-arena-site.vercel.app/" target="_blank" rel="noopener">',
              '        <div class="module-top"><span>05</span><span class="status">RECOVERY</span></div>',
              '        <div><small>ARENA</small><h3>Sovereign Arena</h3><p>A public research and proof surface. Recovery and source-binding work remain in progress; runtime health is not inferred here.</p></div>',
              '        <div class="module-foot">Open surface ↗</div>',
              '      </a>',
              '      <a class="module-card panel" href="/guides">',
              '        <div class="module-top"><span>06</span><span class="status">PUBLIC RESEARCH</span></div>',
              '        <div><small>LABS</small><h3>BitEvo Labs</h3><p>Bounded experiments, research notes and public evidence that are useful before they become products.</p></div>',
              '        <div class="module-foot">Open surface ↗</div>',
              '      </a>',
          ]

          ru_cards = [
              '      <a class="module-card panel" href="/ru/build">',
              '        <div class="module-top"><span>01</span><span class="status">LIVE</span></div>',
              '        <div><small>BUILD</small><h3>BitEvo</h3><p>Создание, аудит и hardening AI-workflows с явными authority, evidence и recovery boundaries.</p></div>',
              '        <div class="module-foot">Открыть surface ↗</div>',
              '      </a>',
              '      <article class="module-card panel module-card-muted">',
              '        <div class="module-top"><span>02</span><span class="status">RELEASE PREP</span></div>',
              '        <div><small>LEARN</small><h3>AI Skill Lab</h3><p>Практическое обучение AI для личного, семейного и бизнес-использования через видимую работу, а не black-box обещания.</p></div>',
              '        <div class="module-foot">Public route пока не опубликован</div>',
              '      </article>',
              '      <a class="module-card panel" href="/ru/vision">',
              '        <div class="module-top"><span>03</span><span class="status">PUBLIC DEMO</span></div>',
              '        <div><small>VISION</small><h3>VisionAssist</h3><p>Evidence-grounded visual reasoning с явными observations, competing hypotheses, counterevidence и uncertainty. Только public demo; private runtime остаётся private.</p></div>',
              '        <div class="module-foot">Открыть surface ↗</div>',
              '      </a>',
              '      <a class="module-card panel" href="https://cryptoguidessite.vercel.app/" target="_blank" rel="noopener">',
              '        <div class="module-top"><span>04</span><span class="status">LIVE · REVIEW</span></div>',
              '        <div><small>CRYPTO</small><h3>Crypto Guides</h3><p>Публичный crypto knowledge portal. Сайт live, но taxonomy, currentness и evidence boundaries продолжают проходить review.</p></div>',
              '        <div class="module-foot">Открыть surface ↗</div>',
              '      </a>',
              '      <a class="module-card panel" href="https://sovereign-arena-site.vercel.app/" target="_blank" rel="noopener">',
              '        <div class="module-top"><span>05</span><span class="status">RECOVERY</span></div>',
              '        <div><small>ARENA</small><h3>Sovereign Arena</h3><p>Публичная research/proof surface. Recovery и source-binding ещё идут; runtime health отсюда не выводится.</p></div>',
              '        <div class="module-foot">Открыть surface ↗</div>',
              '      </a>',
              '      <a class="module-card panel" href="/ru/guides">',
              '        <div class="module-top"><span>06</span><span class="status">PUBLIC RESEARCH</span></div>',
              '        <div><small>LABS</small><h3>BitEvo Labs</h3><p>Bounded experiments, research notes и public evidence, которые полезны до превращения в полноценные продукты.</p></div>',
              '        <div class="module-foot">Открыть surface ↗</div>',
              '      </a>',
          ]

          en_flow = [
              '      <article class="flow-card"><span>01</span><h3>Learn</h3><p>Build skill and judgment with AI Skill Lab.</p></article>',
              '      <article class="flow-card"><span>02</span><h3>Build</h3><p>Turn that capability into bounded workflows and products with BitEvo.</p></article>',
              '      <article class="flow-card"><span>03</span><h3>Specialize</h3><p>Use Vision, Crypto, Arena and Labs as domain-specific surfaces.</p></article>',
          ]
          ru_flow = [
              '      <article class="flow-card"><span>01</span><h3>Учиться</h3><p>Развивать навык и judgment через AI Skill Lab.</p></article>',
              '      <article class="flow-card"><span>02</span><h3>Строить</h3><p>Превращать этот навык в bounded workflows и продукты через BitEvo.</p></article>',
              '      <article class="flow-card"><span>03</span><h3>Специализироваться</h3><p>Использовать Vision, Crypto, Arena и Labs как отдельные domain surfaces.</p></article>',
          ]
          en_evidence = [
              '      <article><strong>SOURCE</strong><p>What code or material exists.</p></article>',
              '      <article><strong>BUILD</strong><p>What was actually built from it.</p></article>',
              '      <article><strong>DEPLOYMENT</strong><p>What a provider accepted.</p></article>',
              '      <article><strong>READBACK</strong><p>What a public or protected surface returns.</p></article>',
              '      <article><strong>EFFECT</strong><p>What the system is actually authorized to do.</p></article>',
          ]
          ru_evidence = [
              '      <article><strong>SOURCE</strong><p>Какой код или материал существует.</p></article>',
              '      <article><strong>BUILD</strong><p>Что реально было из него собрано.</p></article>',
              '      <article><strong>DEPLOYMENT</strong><p>Что принял provider.</p></article>',
              '      <article><strong>READBACK</strong><p>Что возвращает публичная или protected surface.</p></article>',
              '      <article><strong>EFFECT</strong><p>Что системе реально разрешено делать.</p></article>',
          ]

          def replace_expression(lines, marker, replacement):
              start = next((i for i, line in enumerate(lines) if marker in line), None)
              if start is None:
                  raise SystemExit(f'expected expression marker not found: {marker}')
              end = next((i for i in range(start, len(lines)) if lines[i].strip() in ('))}', '})}')), None)
              if end is None:
                  raise SystemExit(f'expected expression end not found: {marker}')
              return lines[:start] + replacement + lines[end + 1:]

          def rewrite(file, cards, flow, evidence):
              path = Path(file)
              lines = path.read_text().splitlines()
              lines = replace_expression(lines, '{modules.map(module => (', route_cards)
              lines = replace_expression(lines, '{modules.map((module, i) => {', cards)
              lines = replace_expression(lines, '{flow.map(item => (', flow)
              lines = replace_expression(lines, '{evidence.map(([name, text]) => (', evidence)
              path.write_text('\n'.join(lines) + '\n')

          rewrite('src/pages/universe.astro', en_cards, en_flow, en_evidence)
          rewrite('src/pages/ru/universe.astro', ru_cards, ru_flow, ru_evidence)
          PY
      - name: Upgrade exact Astro and regenerate lock
        run: |
          npm pkg set engines.node=">=22.19.0"
          npm install astro@7.2.10 --save-exact
      - name: Capture post-upgrade audit without hiding findings
        run: |
          npm audit --json > /tmp/astro7-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const a=JSON.parse(fs.readFileSync('/tmp/astro7-audit.json','utf8'));
          const v=a.metadata?.vulnerabilities || {};
          console.log(`ASTRO7_POST_UPGRADE_AUDIT total=${v.total ?? 'unknown'} critical=${v.critical ?? 'unknown'} high=${v.high ?? 'unknown'} moderate=${v.moderate ?? 'unknown'} low=${v.low ?? 'unknown'}`);
          for (const [name,info] of Object.entries(a.vulnerabilities || {})) {
            console.log(`ASTRO7_AUDIT_ITEM package=${name} severity=${info.severity} range=${info.range}`);
          }
          NODE
      - name: Prove existing provider-neutral contract
        run: npm run build:core
      - name: Remove one-shot workflow and commit exact dependency canary
        run: |
          git rm .github/workflows/astro7-security-canary-bootstrap.yml
          git add package.json package-lock.json docs/ASTRO7_SECURITY_CANARY_20260903.md src/pages/universe.astro src/pages/ru/universe.astro
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Security: canary Astro 7.2.10 with green core build"
          git push origin HEAD:agent/astro7-security-canary-20260903
