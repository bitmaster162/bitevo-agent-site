name: Astro 6 Node CSP Emission Probe

on:
  push:
    branches:
      - agent/astro7-security-canary-20260903

permissions:
  contents: read

jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12.0', '22.19.0']
    name: astro6-node-${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout canary branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: agent/astro7-security-canary-20260903
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install exact baseline dependencies
        run: npm ci
      - name: Print exact toolchain
        run: |
          node --version
          npm --version
          npx astro --version
          node -e "console.log('astro_lock=' + require('./node_modules/astro/package.json').version); console.log('vite_lock=' + require('./node_modules/vite/package.json').version)"
      - name: Build exact baseline site
        run: npm run build:site
      - name: Count emitted inline blocks and CSS assets
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';
          import { join } from 'node:path';
          async function walk(dir){ const out=[]; for(const e of await readdir(dir,{withFileTypes:true})){ const p=join(dir,e.name); if(e.isDirectory()) out.push(...await walk(p)); else out.push(p); } return out; }
          const files=await walk('dist');
          const html=files.filter(f=>f.endsWith('.html'));
          const css=files.filter(f=>f.endsWith('.css'));
          let styles=0,scripts=0,jsonld=0;
          const routes=[];
          for(const file of html){
            const source=await readFile(file,'utf8');
            const sc=[...source.matchAll(/<style\b[^>]*>([\s\S]*?)<\/style>/gi)];
            if(sc.length) routes.push([file,sc.length]);
            styles+=sc.length;
            for(const m of source.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)){
              const attrs=m[1]||'', body=m[2]||'';
              if(/\bsrc\s*=/.test(attrs)||!body.trim()) continue;
              scripts++;
              if((attrs.match(/\btype\s*=\s*["']([^"']+)["']/i)?.[1]||'').toLowerCase()==='application/ld+json') jsonld++;
            }
          }
          const bytes=[];
          for(const file of css) bytes.push((await readFile(file)).length);
          console.log(`NODE_CSP_EMISSION node=${process.version} html=${html.length} inline_style_blocks=${styles} inline_script_blocks=${scripts} jsonld=${jsonld} css_files=${css.length} css_bytes=${bytes.reduce((a,b)=>a+b,0)}`);
          console.log(`STYLE_ROUTES ${JSON.stringify(routes.slice(0,100))}`);
          NODE
      - name: Run canonical inline-CSP verifier
        continue-on-error: true
        run: node scripts/verify-inline-csp.mjs
