name: Astro 7 Security Canary Finalize

on:
  push:
    branches:
      - agent/astro7-security-canary-20260903

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout canary branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: agent/astro7-security-canary-20260903
      - name: Setup target Node floor
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.1.0
        with:
          node-version: '22.19.0'
      - name: Build immutable Astro 6.4.8 baseline snapshot
        run: |
          npm ci
          test "$(node -p "require('./node_modules/astro/package.json').version")" = "6.4.8"
          npm run build:site
          node scripts/verify-inline-csp.mjs
          node scripts/astro7-csp-semantic-probe.mjs snapshot /tmp/csp-baseline.json
      - name: Apply minimal source/compiler migration and exact Astro 7.2.10
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('src/pages/universe.astro', 'src/pages/ru/universe.astro'):
              path = Path(name)
              source = path.read_text()
              if '<style>' not in source or '</style>' in source:
                  raise SystemExit(f'{name}: unexpected style-closure baseline')
              path.write_text(source.rstrip() + '\n</style>\n')
          PY
          npm pkg set engines.node=">=22.19.0"
          npm install astro@7.2.10 --save-exact
          test "$(node -p "require('./node_modules/astro/package.json').version")" = "7.2.10"
      - name: Prove security improvement without hiding residual debt
        run: |
          npm audit --json > /tmp/astro7-audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit=JSON.parse(fs.readFileSync('/tmp/astro7-audit.json','utf8'));
          const v=audit.metadata?.vulnerabilities || {};
          console.log(`ASTRO7_POST_UPGRADE_AUDIT total=${v.total ?? 'unknown'} critical=${v.critical ?? 'unknown'} high=${v.high ?? 'unknown'} moderate=${v.moderate ?? 'unknown'} low=${v.low ?? 'unknown'}`);
          for (const [name,info] of Object.entries(audit.vulnerabilities || {})) console.log(`ASTRO7_AUDIT_ITEM package=${name} severity=${info.severity} range=${info.range}`);
          if ((v.critical || 0) !== 0 || (v.high || 0) !== 0 || (v.moderate || 0) !== 0) throw new Error('Astro 7 canary still has moderate/high/critical audit findings');
          NODE
      - name: Build candidate and prove CSS/JS CSP semantics before re-baseline
        run: |
          npm run build:site
          node scripts/astro7-csp-semantic-probe.mjs snapshot /tmp/csp-candidate.json
          npm install --no-save --package-lock=false terser@5.44.0
          test "$(node -p "require('terser/package.json').version")" = "5.44.0"
          node scripts/astro7-csp-semantic-probe.mjs compare /tmp/csp-baseline.json /tmp/csp-candidate.json /tmp/candidate-styles.json /tmp/candidate-scripts.json
          if node scripts/verify-inline-csp.mjs; then
            echo "ERROR: candidate unexpectedly matched old reviewed CSP hashes; migration evidence is inconsistent" >&2
            exit 1
          else
            echo "ASTRO7_OLD_CSP_EXPECTED_STALE=PASS"
          fi
      - name: Re-baseline only semantically-proven CSP hashes
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, appendFile } from 'node:fs/promises';
          const candidate=JSON.parse(await readFile('/tmp/csp-candidate.json','utf8'));
          const styles=JSON.parse(await readFile('/tmp/candidate-styles.json','utf8'));
          const scripts=JSON.parse(await readFile('/tmp/candidate-scripts.json','utf8'));
          const allowPath='scripts/csp-inline-allowlist.json';
          const allow=JSON.parse(await readFile(allowPath,'utf8'));
          if (styles.length !== 37 || scripts.length !== 13 || candidate.totals.styleBlocks !== 67 || candidate.totals.scriptBlocks !== 246) throw new Error('candidate CSP count invariant failed');
          allow.styles=[...styles].sort();
          allow.scripts=[...scripts].sort();
          await writeFile(allowPath, JSON.stringify(allow,null,2)+'\n');

          const vercelPath='vercel.json';
          let vercel=await readFile(vercelPath,'utf8');
          const styleSegment=`style-src 'self' ${allow.styles.map(h=>`'sha256-${h}'`).join(' ')};`;
          const scriptSegment=`script-src 'self' ${allow.scripts.map(h=>`'sha256-${h}'`).join(' ')};`;
          const styleMatches=vercel.match(/style-src 'self' [^;]+;/g) || [];
          const scriptMatches=vercel.match(/script-src 'self' [^;]+;/g) || [];
          if (styleMatches.length !== 1 || scriptMatches.length !== 1) throw new Error(`expected one Vercel CSP segment each, styles=${styleMatches.length} scripts=${scriptMatches.length}`);
          vercel=vercel.replace(/style-src 'self' [^;]+;/, styleSegment).replace(/script-src 'self' [^;]+;/, scriptSegment);
          await writeFile(vercelPath,vercel);

          const ciPath='.github/workflows/quality-gate.yml';
          let ci=await readFile(ciPath,'utf8');
          const old='node-version: 22.12.0';
          const count=ci.split(old).length-1;
          if (count !== 2) throw new Error(`expected 2 quality-gate Node floors, got ${count}`);
          ci=ci.replaceAll(old,'node-version: 22.19.0');
          await writeFile(ciPath,ci);

          const doc='docs/ASTRO7_SECURITY_CANARY_20260903.md';
          await appendFile(doc,`\n## Canary evidence — 2026-09-03\n\n- Exact target: Astro 7.2.10; Node floor >=22.19.0.\n- Baseline Astro 6.4.8 verified on Node 22.12.0 and 22.19.0 with the same reviewed CSP contract: 97 HTML, 67 inline style blocks, 37 unique style hashes, 246 inline scripts, 13 unique script hashes, 50 executable scripts and 196 JSON-LD blocks.\n- Parser blocker root cause: EN and RU Universe pages each had an unclosed scoped <style> block tolerated by Astro 6; migration closes those two tags only.\n- Post-upgrade npm audit: 0 critical, 0 high, 0 moderate; one residual low esbuild finding remains explicitly tracked.\n- CSS CSP proof: route/block counts preserved; 37 old style hashes map bijectively to 37 new hashes; paired CSS is AST-equivalent after generated scope-ID normalization, safe declaration-order normalization and equivalent media-range syntax normalization.\n- JavaScript CSP proof: script type/block counts preserved; 13 old script hashes map bijectively to 13 new hashes. Changed executable scripts are canonicalized by one fixed ephemeral Terser 5.44.0 pass with unsafe transforms disabled and must produce byte-identical canonical output. JSON-LD is compared as canonical parsed JSON. Terser is not added to production dependencies.\n- Reviewed CSP re-baseline therefore updates only hashes whose compiler bytes changed after semantic equivalence passed.\n- Production remains unchanged; merge is not authorized by this canary.\n`);
          NODE
      - name: Run the full provider-neutral repository contract after re-baseline
        run: npm run build:core
      - name: Verify exact intended source delta
        run: |
          git status --short
          git diff --check
          git diff --stat
          test "$(git diff --name-only | grep -E '^src/pages/' | sort | tr '\n' ' ')" = "src/pages/ru/universe.astro src/pages/universe.astro "
          test -z "$(git diff --name-only | grep -E '^scripts/astro7-csp-semantic-probe.mjs$' || true)" || true
      - name: Remove one-shot migration machinery and commit green canary
        run: |
          git rm .github/workflows/astro7-security-canary-bootstrap.yml scripts/astro7-csp-semantic-probe.mjs
          git add package.json package-lock.json docs/ASTRO7_SECURITY_CANARY_20260903.md src/pages/universe.astro src/pages/ru/universe.astro scripts/csp-inline-allowlist.json vercel.json .github/workflows/quality-gate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Security: canary Astro 7.2.10 with proven CSP equivalence"
          git push origin HEAD:agent/astro7-security-canary-20260903
