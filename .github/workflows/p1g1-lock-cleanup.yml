name: P1G1 Lock Cleanup

on:
  push:
    branches:
      - agent/p1-scope-handoff-r1-implementation

permissions:
  contents: write

jobs:
  lock-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: agent/p1-scope-handoff-r1-implementation
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
      - name: Remove invalid adapter from exact lock
        run: npm uninstall --package-lock-only @astrojs/vercel
      - name: Commit generated cleanup and remove this workflow
        shell: bash
        run: |
          git rm .github/workflows/p1g1-lock-cleanup.yml
          git add package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P1G1: remove incompatible Astro adapter dependency"
          git push origin HEAD:agent/p1-scope-handoff-r1-implementation
