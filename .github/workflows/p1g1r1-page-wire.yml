name: P1G1R1 Intake Client Wiring

on:
  push:
    branches:
      - agent/p1-scope-handoff-r1-implementation

permissions:
  contents: write

jobs:
  wire-client:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: agent/p1-scope-handoff-r1-implementation
      - name: Wire disabled client source into EN/RU intake
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const files=['src/pages/audit-intake.astro','src/pages/ru/audit-intake.astro'];
          const marker='  <script is:inline src="/intake-segmentation.js"></script>';
          const insertion=`${marker}\n  <script is:inline src="/scope-handoff-r1.js"></script>`;
          for (const file of files) {
            const source=await readFile(file,'utf8');
            if (source.includes('/scope-handoff-r1.js')) continue;
            if (!source.includes(marker)) throw new Error(`${file}: canonical segmentation marker missing`);
            await writeFile(file, source.replace(marker,insertion));
          }
          NODE
      - name: Remove one-shot workflow and commit bounded changes
        run: |
          git rm .github/workflows/p1g1r1-page-wire.yml
          git add src/pages/audit-intake.astro src/pages/ru/audit-intake.astro
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "P1G1R1: wire disabled EN/RU scope handoff client"
          git push origin HEAD:agent/p1-scope-handoff-r1-implementation
