name: IndexNow Changed URLs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: bitevo-indexnow-main
  cancel-in-progress: false

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main push
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build URL delta since the last successful main notification
        id: payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHECKPOINT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/indexnow.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
          node scripts/indexnow-changed-urls.mjs "$CHECKPOINT_SHA" "$GITHUB_SHA" --since-success > indexnow-payload.json
          COUNT="$(node -e "const p=require('./indexnow-payload.json'); process.stdout.write(String(p.urlList.length))")"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "INDEXNOW_CHANGED_URLS=$COUNT"

      - name: Wait for exact production build and public key
        if: steps.payload.outputs.count != '0'
        run: node scripts/indexnow-live-gate.mjs

      - name: Submit changed URLs to IndexNow
        if: steps.payload.outputs.count != '0'
        run: node scripts/indexnow-submit.mjs indexnow-payload.json
