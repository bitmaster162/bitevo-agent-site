name: IndexNow Changed URLs

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bitevo-indexnow-main
  cancel-in-progress: false

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main push
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build changed-URL payload (recovery full replay)
        id: payload
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # #257-#260 never reached POST; temporarily replay the current sitemap on admitted main pushes.
          # Remove --full in a separate PR only after a real 200/202 provider receipt.
          node scripts/indexnow-changed-urls.mjs "$BEFORE_SHA" "$GITHUB_SHA" --full > indexnow-payload.json
          COUNT="$(node -e "const p=require('./indexnow-payload.json'); process.stdout.write(String(p.urlList.length))")"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "INDEXNOW_CHANGED_URLS=$COUNT"

      - name: Wait for exact production build and public key
        if: steps.payload.outputs.count != '0'
        run: node scripts/indexnow-live-gate.mjs

      - name: Submit changed URLs to IndexNow
        if: steps.payload.outputs.count != '0'
        run: node scripts/indexnow-submit.mjs indexnow-payload.json
